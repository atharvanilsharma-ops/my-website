<!DOCTYPE html>
<html>

<head>
  <title>Login - AttendPro</title>

  <link rel="stylesheet" href="css/style.css">

  <!-- Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>
    body {
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .login-box {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 400px;
      padding: 40px;
      border-radius: var(--border-radius-lg);
      background: var(--surface-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      box-shadow: var(--glass-shadow);
      text-align: center;
      animation: slideUp 0.8s ease;
    }

    .login-box h2 {
      margin-bottom: 30px;
      color: var(--text-primary);
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 1px;
    }

    .login-box h2 span {
      color: var(--primary-color);
    }

    .input-group {
      position: relative;
      margin-bottom: 20px;
      text-align: left;
    }

    .input-group label {
      display: block;
      margin-bottom: 8px;
      font-size: 13px;
      color: var(--text-secondary);
      font-weight: 500;
    }

    .input-group input {
      width: 100%;
      max-width: 100%;
      padding: 14px 40px 14px 16px;
      border-radius: var(--border-radius-sm);
      margin: 0;
    }

    .input-group i {
      position: absolute;
      right: 15px;
      top: 38px;
      color: var(--text-secondary);
      cursor: pointer;
    }

    button.login-btn {
      width: 100%;
      padding: 14px;
      border-radius: var(--border-radius-sm);
      margin-top: 10px;
      font-size: 16px;
      letter-spacing: 0.5px;
    }

    .error {
      color: var(--danger);
      font-size: 14px;
      margin-bottom: 15px;
      min-height: 20px;
    }

    .footer {
      margin-top: 25px;
      font-size: 13px;
      color: var(--text-secondary);
    }
  </style>
</head>

<body>

  <div class="login-split-container">

    <!-- Hero Branding Section -->
    <div class="login-hero">
      <div class="login-hero-content">
        <h1>Attend<span class="text-gradient">Pro</span></h1>
        <p>Experience the next generation of campus intelligence. Seamlessly track attendance, analyze trends, and
          manage university sessions with our state-of-the-art platform.</p>
      </div>
    </div>

    <!-- Login Form Section -->
    <div class="login-form-area" style="position: relative; overflow: hidden;">
      <div class="orb orb-1"></div>
      <div class="orb orb-2"></div>
      <div class="login-box">
        <h2 style="margin-bottom: 10px;">Welcome Back</h2>
        <p style="color: var(--text-secondary); margin-bottom: 30px; font-size: 14px;">Sign in to access your dashboard
        </p>

        <div class="error" id="error"></div>

        <div class="form-group">
          <label>Email Address</label>
          <div style="position: relative;">
            <input id="email" placeholder="xyz@gmail.com" autocomplete="off">
            <i class="fas fa-envelope"
              style="position: absolute; right: 15px; top: 18px; color: var(--text-secondary);"></i>
          </div>
        </div>

        <div class="form-group">
          <label>Password</label>
          <div style="position: relative;">
            <input id="password" type="password" placeholder="Enter your password">
            <i class="fas fa-eye" onclick="togglePassword()"
              style="position: absolute; right: 15px; top: 18px; color: var(--text-secondary); cursor: pointer;"></i>
          </div>
        </div>

        <button class="login-btn" onclick="login()" style="width: 100%; margin-top: 10px;">
          Authenticate <i class="fas fa-arrow-right"></i>
        </button>

        <div class="footer" style="margin-top: 35px; border-top: 1px solid var(--glass-border); padding-top: 20px;">
          © 2026 AttendPro Management System. All rights reserved.
        </div>
      </div>
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
  <script src="js/main.js"></script>

  <script>

    // BASE_URL is now handled in main.js

    // 👁️ TOGGLE PASSWORD
    function togglePassword() {
      const pwd = document.getElementById("password");
      const icon = document.querySelector(".fa-eye") || document.querySelector(".fa-eye-slash");
      if (pwd.type === "password") {
        pwd.type = "text";
        icon.classList.remove("fa-eye");
        icon.classList.add("fa-eye-slash");
      } else {
        pwd.type = "password";
        icon.classList.remove("fa-eye-slash");
        icon.classList.add("fa-eye");
      }
    }

    // 🚀 LOGIN FUNCTION
    async function login() {
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value.trim();

      if (!email || !password) {
        alert("Please enter email and password");
        return;
      }

      try {
        const res = await fetch(`${BASE_URL}/auth/login`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            email: email,
            password: password
          })
        });

        const data = await res.json();

        console.log("SERVER RESPONSE:", data);

        // ❌ LOGIN FAILED
        if (!res.ok) {
          showToast(data.message || "Login failed", "error");
          return;
        }

        // ✅ SAVE USER IN LOCAL STORAGE (VERY IMPORTANT)
        localStorage.setItem("user", JSON.stringify(data));

        // ✅ REDIRECT BASED ON ROLE
        if (data.role === "admin") {
          window.location.href = "admin.html";
        }
        else if (data.role === "teacher") {
          window.location.href = "teacher.html";
        }
        else if (data.role === "student") {
          window.location.href = "student.html";
        }
        else {
          alert("Unknown role");
        }

      } catch (err) {
        console.log(err);
        showToast("Server error. Check console.", "error");
      }
    }

  </script>

</body>

</html>
