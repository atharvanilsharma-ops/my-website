<!DOCTYPE html>
<html>

<head>
  <title>Login - AttendPro</title>

  <link rel="stylesheet" href="css/style.css">

  <!-- Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>
    body {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #1e293b, #0f172a);
      overflow: hidden;
    }

    /* Animated background */
    body::before {
      content: "";
      position: absolute;
      width: 600px;
      height: 600px;
      background: #3b82f6;
      filter: blur(150px);
      top: -100px;
      left: -100px;
    }

    body::after {
      content: "";
      position: absolute;
      width: 600px;
      height: 600px;
      background: #6366f1;
      filter: blur(150px);
      bottom: -100px;
      right: -100px;
    }

    .login-box {
      position: relative;
      z-index: 1;
      width: 320px;
      padding: 30px;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(12px);
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
      text-align: center;
      animation: fadeIn 0.8s ease;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .login-box h2 {
      margin-bottom: 20px;
      color: #38bdf8;
    }

    .input-group {
      position: relative;
      margin-bottom: 15px;
    }

    .input-group input {
      width: 100%;
      padding: 10px 40px 10px 10px;
      border-radius: 8px;
      border: none;
      outline: none;
    }

    .input-group i {
      position: absolute;
      right: 10px;
      top: 12px;
      cursor: pointer;
      color: #555;
    }

    button {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: none;
      background: linear-gradient(135deg, #3b82f6, #6366f1);
      color: white;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      transform: scale(1.05);
    }

    .error {
      color: #f87171;
      font-size: 14px;
      margin-bottom: 10px;
    }

    .footer {
      margin-top: 15px;
      font-size: 12px;
      color: #aaa;
    }
  </style>
</head>

<body>

  <div class="login-box">
    <h2>AttendPro</h2>

    <div class="error" id="error"></div>

    <div class="input-group">
      <input id="email" placeholder="Email">
      <i class="fas fa-envelope"></i>
    </div>

    <div class="input-group">
      <input id="password" type="password" placeholder="Password">
      <i class="fas fa-eye" onclick="togglePassword()"></i>
    </div>

    <button onclick="login()" id="btn">Login</button>

    <div class="footer">© 2026 AttendPro</div>
  </div>

  <script>
    function togglePassword() {
      const pass = document.getElementById("password");
      pass.type = pass.type === "password" ? "text" : "password";
    }

    // 🚀 LOGIN FUNCTION

    async function login() {
      const btn = document.getElementById("btn");
      const errorBox = document.getElementById("error");

      errorBox.innerText = "";

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value.trim();

      if (!email || !password) {
        errorBox.innerText = "Please fill all fields";
        return;
      }

      btn.innerText = "Logging in...";
      btn.disabled = true;

      try {
        const res = await fetch("https://my-website-ej59.onrender.com/auth/login", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ email, password })
        });

        // ✅ HANDLE SERVER ERROR SAFELY
        if (!res.ok) {
          const text = await res.text(); // don't parse JSON blindly
          console.log("SERVER RESPONSE:", text);

          errorBox.innerText = "Login failed (check server)";
          btn.innerText = "Login";
          btn.disabled = false;
          return;
        }

        const user = await res.json();

        if (!user.role) {
          errorBox.innerText = user.message || "Invalid login";
          btn.innerText = "Login";
          btn.disabled = false;
          return;
        }

        localStorage.setItem("user", JSON.stringify(user));

        // ✅ redirect
        if (user.role === "admin") location.href = "admin.html";
        if (user.role === "teacher") location.href = "teacher.html";
        if (user.role === "student") location.href = "student.html";

      } catch (err) {
        console.log("LOGIN FRONTEND ERROR:", err);
        errorBox.innerText = "Server not responding";
        btn.innerText = "Login";
        btn.disabled = false;
      }
    }


  </script>

</body>

</html>
