<!DOCTYPE html>
<html>

<head>
  <title>Login - AttendPro</title>

  <link rel="stylesheet" href="css/style.css">

  <!-- Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>
    body {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #1e293b, #0f172a);
      overflow: hidden;
    }

    /* Animated background */
    body::before {
      content: "";
      position: absolute;
      width: 600px;
      height: 600px;
      background: #3b82f6;
      filter: blur(150px);
      top: -100px;
      left: -100px;
    }

    body::after {
      content: "";
      position: absolute;
      width: 600px;
      height: 600px;
      background: #6366f1;
      filter: blur(150px);
      bottom: -100px;
      right: -100px;
    }

    .login-box {
      position: relative;
      z-index: 1;
      width: 320px;
      padding: 30px;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(12px);
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
      text-align: center;
      animation: fadeIn 0.8s ease;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .login-box h2 {
      margin-bottom: 20px;
      color: #38bdf8;
    }

    .input-group {
      position: relative;
      margin-bottom: 15px;
    }

    .input-group input {
      width: 100%;
      padding: 10px 40px 10px 10px;
      border-radius: 8px;
      border: none;
      outline: none;
    }

    .input-group i {
      position: absolute;
      right: 10px;
      top: 12px;
      cursor: pointer;
      color: #555;
    }

    button {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: none;
      background: linear-gradient(135deg, #3b82f6, #6366f1);
      color: white;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      transform: scale(1.05);
    }

    .error {
      color: #f87171;
      font-size: 14px;
      margin-bottom: 10px;
    }

    .footer {
      margin-top: 15px;
      font-size: 12px;
      color: #aaa;
    }
  </style>
</head>

<body>

  <div class="login-box">
    <h2>AttendPro</h2>

    <div class="error" id="error"></div>

    <div class="input-group">
      <input id="email" placeholder="Email">
      <i class="fas fa-envelope"></i>
    </div>

    <div class="input-group">
      <input id="password" type="password" placeholder="Password">
      <i class="fas fa-eye" onclick="togglePassword()"></i>
    </div>

    <button onclick="login()">Login</button>

    <div class="footer">© 2026 AttendPro</div>
  </div>

  <script>

const BASE_URL = "https://my-website-ej59.onrender.com";

// 🚀 LOGIN FUNCTION
async function login() {
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value.trim();

  if (!email || !password) {
    alert("Please enter email and password");
    return;
  }

  try {
    const res = await fetch(`${BASE_URL}/auth/login`, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        email: email,
        password: password
      })
    });

    const data = await res.json();

    console.log("SERVER RESPONSE:", data);

    // ❌ LOGIN FAILED
    if (!res.ok) {
      alert(data.message || "Login failed");
      return;
    }

    // ✅ SAVE USER IN LOCAL STORAGE (VERY IMPORTANT)
    localStorage.setItem("user", JSON.stringify(data));

    // ✅ REDIRECT BASED ON ROLE
    if (data.role === "admin") {
      window.location.href = "admin.html";
    }
    else if (data.role === "teacher") {
      window.location.href = "teacher.html";
    }
    else if (data.role === "student") {
      window.location.href = "student.html";
    }
    else {
      alert("Unknown role");
    }

  } catch (err) {
    console.log("LOGIN ERROR:", err);
    alert("Server error ❌");
  }
}

</script>

</body>

</html>
