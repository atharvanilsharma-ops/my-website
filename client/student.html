<!DOCTYPE html>
<html>

<head>
  <title>Student Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>


  <style>
    /* ===== GLOBAL ===== */
    body {
      margin: 0;
      font-family: 'Inter', 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #0f172a, #020617);
      color: #e2e8f0;
    }

    /* ===== LAYOUT ===== */
    .container {
      display: flex;
    }

    /* ===== SIDEBAR ===== */
    .sidebar {
      width: 230px;
      height: 100vh;
      background: rgba(2, 6, 23, 0.9);
      backdrop-filter: blur(12px);
      padding: 25px;
      border-right: 1px solid rgba(255, 255, 255, 0.05);
    }

    .sidebar h2 {
      color: #6366f1;
      margin-bottom: 30px;
    }

    /* ===== MAIN ===== */
    .main {
      flex: 1;
      padding: 25px;
    }

    /* ===== SECTIONS ===== */
    .section {
      background: rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.05);
      padding: 20px;
      border-radius: 18px;
      margin-bottom: 20px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
      transition: 0.3s;
    }

    .section:hover {
      transform: translateY(-5px);
    }

    /* ===== CARDS ===== */
    .cards {
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
    }

    .card {
      flex: 1;
      min-width: 120px;
      padding: 18px;
      border-radius: 14px;
      background: rgba(51, 65, 85, 0.6);
      text-align: center;
      transition: 0.3s;
    }

    .card:hover {
      transform: scale(1.05);
    }

    /* ===== PROGRESS ===== */
    .progress-bar {
      background: #1e293b;
      border-radius: 10px;
      overflow: hidden;
      margin-top: 12px;
    }

    .progress-fill {
      height: 18px;
      background: linear-gradient(90deg, #4f46e5, #22c55e);
      transition: 0.4s;
    }

    /* ===== BUTTON ===== */
    button {
      padding: 8px 14px;
      border-radius: 8px;
      border: none;
      background: linear-gradient(135deg, #4f46e5, #6366f1);
      color: white;
      cursor: pointer;
      margin: 5px;
      transition: 0.3s;
    }

    button:hover {
      transform: scale(1.05);
      opacity: 0.9;
    }

    /* ===== CHART ===== */
    .chart-box {
      width: 260px;
      height: 260px;
    }

    .trend-box {
      width: 100%;
      max-width: 520px;
      height: 260px;
    }

    canvas {
      width: 100% !important;
      height: 100% !important;
    }

    /* ===== CALENDAR ===== */
    .calendar {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
    }

    .header {
      text-align: center;
      font-weight: 600;
      padding: 5px;
      opacity: 0.7;
    }

    .day {
      padding: 10px;
      text-align: center;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.2s;
    }

    .day:hover {
      transform: scale(1.15);
    }

    .present {
      background: #22c55e;
    }

    .absent {
      background: #ef4444;
    }

    .no {
      background: #eab308;
      color: black;
    }

    /* ===== HEATMAP ===== */
    .heatmap {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
    }

    .heat-cell {
      width: 100%;
      padding-top: 100%;
      border-radius: 6px;
      position: relative;
      transform: scale(0.8);
      opacity: 0;
      animation: fadeIn 0.4s ease forwards;
    }

    @keyframes fadeIn {
      to {
        transform: scale(1);
        opacity: 1;
      }
    }

    .level-0 {
      background: #1e293b;
    }

    .level-1 {
      background: #065f46;
    }

    .level-2 {
      background: #10b981;
    }

    .level-3 {
      background: #22c55e;
    }

    .heat-cell:hover {
      transform: scale(1.2);
      z-index: 2;
    }

    /* ===== TOOLTIP ===== */
    .tooltip {
      position: absolute;
      bottom: 120%;
      left: 50%;
      transform: translateX(-50%);
      background: #020617;
      padding: 8px;
      border-radius: 8px;
      font-size: 12px;
      display: none;
      white-space: pre;
    }

    .heat-cell:hover .tooltip {
      display: block;
    }

    /* ===== POPUP ===== */
    .popup {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.6);
      display: none;
      justify-content: center;
      align-items: center;
    }

    .popup-box {
      background: #1e293b;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    }

    /* ===== MOBILE ===== */
    @media(max-width:768px) {
      .sidebar {
        display: none;
      }
    }
  </style>

</head>

<body>

  <div class="container">

    <div class="sidebar">
      <h2>AttendPro</h2>
    </div>

    <div class="main">

      <div class="section">
        <h2>Student Dashboard</h2>
        <h3 id="monthTitle"></h3>
        <button onclick="prevMonth()">⬅</button>
        <button onclick="nextMonth()">➡</button>
      </div>

      <div class="section">
        <h2 id="percentage"></h2>

        <div class="progress-bar">
          <div id="progressFill" class="progress-fill"></div>
        </div>

        <div class="cards">
          <div class="card">Total <p id="total"></p>
          </div>
          <div class="card">Present <p id="present"></p>
          </div>
          <div class="card">Absent <p id="absent"></p>
          </div>
        </div>
      </div>

      <div class="section">
        <div class="chart-box">
          <canvas id="chart"></canvas>
        </div>
      </div>

      <div class="section">
        <p id="prediction"></p>

        <div class="trend-box">
          <canvas id="trendChart"></canvas>
        </div>
      </div>

      <div class="section">
        <h3>Calendar</h3>
        <div id="calendar" class="calendar"></div>
      </div>

      <div class="section">
        <h3>Attendance Heatmap</h3>
        <div id="heatmap" class="heatmap"></div>
      </div>

    </div>
  </div>

  <!-- POPUP -->
  <div id="popup" class="popup">
    <div class="popup-box">
      <h3 id="popupDate"></h3>
      <p id="popupStatus"></p>
      <button onclick="closePopup()">Close</button>
    </div>
  </div>

  <script>
const BASE_URL = "https://my-website-ej59.onrender.com";

// Get logged user
const user = JSON.parse(localStorage.getItem("user"));

if (!user || !user._id) {
  alert("User not logged in");
  window.location.href = "login.html";
}

let attendanceData = [];
let currentMonth = new Date().getMonth();
let currentYear = new Date().getFullYear();

/* =======================
   LOAD DATA (FIXED)
======================= */
async function loadData() {
  try {
    console.log("🚀 Fetching attendance for user:", user._id);

    const res = await fetch(`${BASE_URL}/student/attendance/${user._id}`);

    // ❗ Check if API failed
    if (!res.ok) {
      console.log("❌ API Error:", res.status);
      attendanceData = [];
      updateDashboard();
      return;
    }

    const data = await res.json();

    // 🔍 DEBUG LOGS (VERY IMPORTANT)
    console.log("✅ User ID:", user._id);
    console.log("📊 Raw API Data:", data);

    // ✅ Ensure correct format
    if (!Array.isArray(data)) {
      console.log("⚠️ Data is not array, resetting...");
      attendanceData = [];
    } else {
      attendanceData = data;
    }

    console.log("📦 Final Attendance Data:", attendanceData);

  } catch (err) {
    console.log("❌ Fetch Error:", err);
    attendanceData = [];
  }

  // 🔄 Always update UI
  updateDashboard();
}
/* =======================
   UPDATE DASHBOARD
======================= */

function updateDashboard() {

  const filtered = attendanceData.filter(a => {
  if (!a.date) return false;   // ✅ safety check
  const d = new Date(a.date);
  return d.getMonth() === currentMonth && d.getFullYear() === currentYear;
});

  const total = filtered.length;
  const present = filtered.filter(a => a.status === "present").length;
  const absent = filtered.filter(a => a.status === "absent").length;

  const percent = total ? (present / total) * 100 : 0;

  document.getElementById("total").innerText = total;
  document.getElementById("present").innerText = present;
  document.getElementById("absent").innerText = absent;
  document.getElementById("percentage").innerText = percent.toFixed(1) + "%";
  document.getElementById("progressFill").style.width = percent + "%";

  const months = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  document.getElementById("monthTitle").innerText = months[currentMonth] + " " + currentYear;

  /* ===== PIE CHART ===== */
  if (window.chart) window.chart.destroy();

  window.chart = new Chart(document.getElementById("chart"), {
    type: "doughnut",
    data: {
      labels: ["Present", "Absent"],
      datasets: [{
        data: [present, absent]
      }]
    },
    options: { maintainAspectRatio: false }
  });

  /* ===== TREND GRAPH ===== */
  if (window.trend) window.trend.destroy();

  const map = {};
  attendanceData.forEach(a => {
    const d = new Date(a.date).toLocaleDateString();
    if (!map[d]) map[d] = { p: 0, t: 0 };
    map[d].t++;
    if (a.status === "present") map[d].p++;
  });

  const labels = Object.keys(map);
  const values = labels.map(d => (map[d].p / map[d].t) * 100);

  window.trend = new Chart(document.getElementById("trendChart"), {
    type: "line",
    data: {
      labels,
      datasets: [{
        data: values
      }]
    },
    options: { maintainAspectRatio: false }
  });

  document.getElementById("prediction").innerText =
    percent < 75 ? "⚠ Low Attendance Alert" : "✅ Good Attendance";

  buildCalendar(filtered);
  buildHeatmap();
}


/* =======================
   CALENDAR
======================= */
function buildCalendar(data) {
  const cal = document.getElementById("calendar");
  cal.innerHTML = "";

  const days = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
  days.forEach(d => {
    const el = document.createElement("div");
    el.innerText = d;
    el.classList.add("header");
    cal.appendChild(el);
  });

  const firstDay = new Date(currentYear, currentMonth, 1).getDay();
  const start = firstDay === 0 ? 6 : firstDay - 1;

  for (let i = 0; i < start; i++) {
    cal.appendChild(document.createElement("div"));
  }

  const totalDays = new Date(currentYear, currentMonth + 1, 0).getDate();

  for (let i = 1; i <= totalDays; i++) {
    const div = document.createElement("div");
    div.innerText = i;
    div.classList.add("day");

    const records = data.filter(a => new Date(a.date).getDate() === i);

    if (records.length > 0) {
      div.classList.add(records.some(r => r.status === "absent") ? "absent" : "present");
    } else {
      div.classList.add("no");
    }

    cal.appendChild(div);
  }
}


/* =======================
   HEATMAP
======================= */
function buildHeatmap() {
  const heatmap = document.getElementById("heatmap");
  heatmap.innerHTML = "";

  for (let i = 30; i >= 0; i--) {
    const date = new Date();
    date.setDate(date.getDate() - i);

    const dayRecords = attendanceData.filter(a =>
      new Date(a.date).toDateString() === date.toDateString()
    );

    let level = 0;

    if (dayRecords.length > 0) {
      const present = dayRecords.filter(r => r.status === "present").length;
      const percent = (present / dayRecords.length) * 100;

      if (percent > 75) level = 3;
      else if (percent > 50) level = 2;
      else level = 1;
    }

    const cell = document.createElement("div");
    cell.classList.add("heat-cell", `level-${level}`);
    heatmap.appendChild(cell);
  }
}


/* =======================
   NAVIGATION
======================= */
function prevMonth() {
  currentMonth--;
  if (currentMonth < 0) { currentMonth = 11; currentYear--; }
  updateDashboard();
}

function nextMonth() {
  currentMonth++;
  if (currentMonth > 11) { currentMonth = 0; currentYear++; }
  updateDashboard();
}


/* =======================
   START
======================= */
window.onload = loadData;

</script>

</body>

</html>
